# Continuous integration (spec §19).
#
# Runs on every push and pull request. The unit and integration jobs need no
# services: the suite starts its own in-memory MongoDB replica set, and caching
# and queueing are off in tests, so nothing needs Redis. The Docker job is the
# exception — it runs the real image against real dependencies.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Check formatting
        run: npx prettier --check .

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    strategy:
      fail-fast: false
      matrix:
        # 20 is the documented floor; 22 catches anything the next LTS breaks.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      # The in-memory MongoDB binary is ~65MB; caching it turns a two-minute
      # download into a cache hit.
      - name: Cache the in-memory MongoDB binary
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: mongodb-binary-${{ runner.os }}

      - run: npm run test:coverage
      - name: Upload coverage
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Production dependencies are what ships; a dev-only advisory should not
      # fail a deploy, so it is reported without blocking.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit dev dependencies (advisory only)
        run: npm audit --audit-level=moderate || true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [quality, test]

    # Real dependencies, so the smoke test proves the image can actually reach
    # them rather than merely that the process starts. Mongo is standalone here:
    # nothing on the health path needs a transaction, and a replica set would
    # add init flakiness for no extra coverage. Checkout's replica-set
    # requirement is covered by the integration suite.
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          load: true
          tags: shopcore:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image that cannot start, or cannot reach its database, is not a
      # passing build.
      - name: Verify the image boots and reaches its dependencies
        run: |
          # --network host so the container sees the service containers, which
          # are published on the runner's localhost.
          docker run -d --name shopcore-ci --network host \
            -e NODE_ENV=production \
            -e PORT=5000 \
            -e MONGO_URI=mongodb://127.0.0.1:27017/shopcore \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e JWT_ACCESS_SECRET=$(head -c 32 /dev/urandom | base64) \
            -e JWT_REFRESH_SECRET=$(head -c 32 /dev/urandom | base64) \
            -e PAYMENT_WEBHOOK_SECRET=$(head -c 16 /dev/urandom | base64) \
            -e CORS_ORIGINS=https://example.com \
            shopcore:ci

          echo "Waiting for the container to serve traffic..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health > /dev/null 2>&1; then
              echo "Liveness OK"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Container never started:"
              docker logs shopcore-ci
              exit 1
            fi
            sleep 2
          done

          # Readiness is the assertion that matters: it pings Mongo and Redis,
          # so a 200 proves the image can actually talk to both.
          echo "Checking readiness..."
          READY=$(curl -fsS http://127.0.0.1:5000/health/ready 2>/dev/null || true)
          echo "$READY"

          if ! echo "$READY" | grep -q '"status":"ready"'; then
            echo "Container started but is not ready:"
            docker logs shopcore-ci
            exit 1
          fi

          echo "Image boots and reaches Mongo and Redis."

      # Runs against the real container, in production mode - the environment
      # the Jest suite cannot reproduce, since it runs with NODE_ENV=test.
      - name: Smoke-test the running container
        run: node scripts/smoke.js
        env:
          SMOKE_BASE_URL: http://127.0.0.1:5000

      - name: Container logs
        if: always()
        run: docker logs shopcore-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f shopcore-ci || true

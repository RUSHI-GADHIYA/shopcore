# Continuous integration (spec §19).
#
# Runs on every push and pull request. No services are declared: the
# integration suite starts its own in-memory MongoDB replica set, and caching
# and queueing are switched off so nothing needs Redis.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test

jobs:
  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Check formatting
        run: npx prettier --check .

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the documented floor; 22 catches anything the next LTS breaks.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      # The in-memory MongoDB binary is ~65MB; caching it turns a two-minute
      # download into a cache hit.
      - name: Cache the in-memory MongoDB binary
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: mongodb-binary-${{ runner.os }}

      - run: npm run test:coverage
      - name: Upload coverage
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Production dependencies are what ships; a dev-only advisory should not
      # fail a deploy, so it is reported without blocking.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit dev dependencies (advisory only)
        run: npm audit --audit-level=moderate || true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          load: true
          tags: shopcore:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image that cannot start is not a passing build.
      - name: Verify the image boots and reports healthy
        run: |
          docker run -d --name shopcore-ci \
            -e NODE_ENV=production \
            -e MONGO_URI=mongodb://127.0.0.1:27017/shopcore \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e JWT_ACCESS_SECRET=$(head -c 32 /dev/urandom | base64) \
            -e JWT_REFRESH_SECRET=$(head -c 32 /dev/urandom | base64) \
            -e PAYMENT_WEBHOOK_SECRET=$(head -c 16 /dev/urandom | base64) \
            -e CORS_ORIGINS=https://example.com \
            -p 5000:5000 shopcore:ci

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/health > /dev/null; then
              echo "Container is serving traffic"
              docker rm -f shopcore-ci
              exit 0
            fi
            sleep 2
          done

          echo "Container never became healthy:"
          docker logs shopcore-ci
          exit 1
